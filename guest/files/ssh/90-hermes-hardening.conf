# Only the admin account, only by key, only from the Mac (also enforced by nftables).
PermitRootLogin no
AllowUsers @ADMIN_USER@
AuthenticationMethods publickey
PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
PermitUserEnvironment no

# No agent, X11, tunnel or remote forwarding. Local forwarding stays for the
# optional Hermes dashboard: ssh -L 9119:127.0.0.1:9119 @ADMIN_USER@@hermes-vm
AllowAgentForwarding no
AllowTcpForwarding local
AllowStreamLocalForwarding no
GatewayPorts no
X11Forwarding no
PermitTunnel no

MaxAuthTries 3
MaxSessions 4
LoginGraceTime 20
ClientAliveInterval 300
ClientAliveCountMax 2
LogLevel VERBOSE

# Modern crypto only (OpenSSH on Ubuntu 26.04 and current macOS both support these)
HostKeyAlgorithms ssh-ed25519
KexAlgorithms mlkem768x25519-sha256,sntrup761x25519-sha512@openssh.com,curve25519-sha256
Ciphers chacha20-poly1305@openssh.com,aes256-gcm@openssh.com
MACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com
